<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMPERIAL HUNT - Download ROM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;background:#0a0a0a;color:#e6edf3;font-family:monospace}
.container{display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;padding:24px;gap:20px;text-align:center}
h1{font-size:32px;color:#c8a030;letter-spacing:3px;text-shadow:0 0 20px rgba(200,160,48,0.4)}
.sub{color:#888;font-size:14px;line-height:1.6}
.status{font-size:18px;color:#4a4;padding:16px 32px;border:2px solid #333;border-radius:8px;
  background:#111;min-width:300px}
.status.downloading{border-color:#4a4;animation:pulse 1.5s infinite}
.status.done{border-color:#c8a030;color:#c8a030}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.manual{margin-top:8px}
.manual a{color:#4488cc;font-size:14px;text-decoration:none;border-bottom:1px dashed #4488cc}
.manual a:hover{color:#66aaee;border-color:#66aaee}
.info{color:#444;font-size:11px;line-height:1.6;max-width:400px}
.play-link{margin-top:4px}
.play-link a{color:#c8a030;font-size:16px;text-decoration:none;
  padding:8px 24px;border:2px solid #c8a030;border-radius:6px;display:inline-block}
.play-link a:hover{background:#c8a030;color:#0a0a0a}
</style>
</head>
<body>
<div class="container">
  <h1>IMPERIAL HUNT</h1>
  <div class="sub">A Space Marine's Creature Quest - GBC Style RPG</div>
  <div id="status" class="status downloading">Downloading ImperialHunt.gbc ...</div>
  <div class="manual">
    <a id="manualLink" href="ImperialHunt.gbc" download="ImperialHunt.gbc">Click here if download didn't start</a>
  </div>
  <div class="play-link">
    <a href="imperial-hunt.html">Play in Browser</a>
  </div>
  <div class="info">
    32 KB ROM &bull; Compatible with any Game Boy Color emulator<br>
    (BGB, mGBA, Gambatte, RetroArch, etc.)
  </div>
</div>
<script>
(function(){
  var status = document.getElementById('status');
  // Auto-trigger download immediately
  var a = document.createElement('a');
  a.href = 'ImperialHunt.gbc';
  a.download = 'ImperialHunt.gbc';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  // Update status after short delay
  setTimeout(function(){
    status.textContent = 'Download started! Check your downloads folder.';
    status.className = 'status done';
  }, 1500);
})();
</script>
</body>
</html>
