<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IMPERIAL HUNT - Preview</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; width: 100%;
    background: #0a0a0a; color: #e6edf3;
    font-family: monospace;
  }
  .container {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; padding: 16px; gap: 16px;
  }
  h1 { font-size: 28px; color: #c8a030; letter-spacing: 2px; }
  .sub { color: #666; font-size: 14px; }
  iframe {
    border: 4px solid #333; border-radius: 8px;
    image-rendering: pixelated;
    background: #000;
  }
  .info { color: #444; font-size: 12px; text-align: center; line-height: 1.6; }
  a { color: #4488cc; }
</style>
</head>
<body>
<div class="container">
  <h1>IMPERIAL HUNT</h1>
  <div class="sub">A Space Marine's Creature Quest - GBC Style RPG</div>
  <iframe src="game/imperial-hunt.html" width="492" height="470" allowfullscreen></iframe>
  <div class="info">
    Arrow Keys / WASD = Move | Z / Space = Confirm | X = Back | Enter = Menu<br>
    Game auto-saves to localStorage | Touch controls on mobile
  </div>
</div>
</body>
</html>
